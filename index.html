<!DOCTYPE html>
<!--
  ============================================================
  mirobol.fr — Bac à sable / banc d'essai des projets (marque SV)
  Version 1.0.0
  ------------------------------------------------------------
  Rôle : site de TEST, séparé de baiji.fr (la vitrine « propre »).
  On y pose des projets en cours d'essai, chacun dans son dossier,
  puis on les promeut vers baiji.fr quand ils sont prêts.

  COMMENT AJOUTER UN TEST :
  1. Crée un dossier à la racine du dépôt, ex. "essai-jeu/",
     avec dedans au moins un "index.html".
  2. Ajoute une ligne dans la liste TESTS ci-dessous (en bas) :
        { nom: "Essai jeu", desc: "...", url: "essai-jeu/" }
  → il apparaîtra sur cette page, accessible à mirobol.fr/essai-jeu/

  Tant que la liste TESTS est vide, la page affiche un message
  « aucun test en ligne » (c'est normal au départ).
  ============================================================
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mirobol — bac à sable</title>
  <meta name="description" content="Banc d'essai des projets, sous la marque SV.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Police de la charte SV : Manrope (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ---- COULEURS DE LA CHARTE SV (thème clair par défaut) ---- */
    :root {
      --surface:        #f6f9f9;
      --surface-raised: #ffffff;
      --line:           #d6e2e3;
      --ink:            #102a2e;
      --ink-muted:      #4d6468;
      --teal:           #0f7c7b;
      --on-teal:        #ffffff;
      --teal-soft:      #d4ecea;
      --accent:         #20b2a6;
    }
    /* ---- MODE SOMBRE AUTOMATIQUE (valeurs « Sombre » de la charte) ---- */
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:        #0e1a1c;
        --surface-raised: #152427;
        --line:           #26393c;
        --ink:            #e6f1f1;
        --ink-muted:      #9db3b5;
        --teal:           #3cc2b8;
        --on-teal:        #062022;
        --teal-soft:      #1c4245;
        --accent:         #5fe0d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 0 16px;
    }

    .page { max-width: 760px; margin: 0 auto; padding: 56px 0 72px; }

    header { text-align: center; margin-bottom: 40px; }

    .logo { width: 72px; height: 72px; margin: 0 auto 18px; display: block; color: var(--teal); }
    .logo svg { width: 100%; height: 100%; display: block; }

    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    h1 .ext { color: var(--teal); font-weight: 700; }

    /* Petite étiquette « BANC D'ESSAI » pour bien distinguer de baiji.fr */
    .ruban {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--on-teal);
      background: var(--teal);
      border-radius: 999px;
      padding: 4px 12px;
    }

    .tagline { color: var(--ink-muted); margin-top: 12px; font-size: 1rem; }

    /* ---- GRILLE DE CARTES ---- */
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .carte {
      background: var(--surface-raised);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease;
    }
    .carte:hover { transform: translateY(-3px); border-color: var(--teal); }

    .pastille {
      flex: 0 0 44px; height: 44px;
      border-radius: 10px;
      background: var(--teal); color: var(--on-teal);
      font-weight: 800; font-size: 1.15rem;
      display: flex; align-items: center; justify-content: center;
    }
    .carte-texte { min-width: 0; }
    .carte-nom  { font-weight: 700; font-size: 1.02rem; }
    .carte-desc { color: var(--ink-muted); font-size: 0.86rem; margin-top: 2px; }

    /* Message affiché quand il n'y a encore aucun test */
    .vide {
      text-align: center;
      color: var(--ink-muted);
      background: var(--teal-soft);
      border-radius: 12px;
      padding: 28px 20px;
      font-size: 0.95rem;
    }

    footer { text-align: center; color: var(--ink-muted); font-size: 0.8rem; margin-top: 48px; }
    footer .marque { color: var(--teal); font-weight: 700; }
  </style>
</head>

<body>

    <header>
      <!-- Logo SV « le geste », repris de la charte (une seule encre : currentColor) -->
      <div class="logo" aria-label="Logo SV">

        </svg>
      </div>

      <h1>mirobol<span class="ext">.fr</span></h1>
      <span class="ruban">Banc d'essai</span>
      <p class="tagline">Les projets en cours de test, avant leur passage sur baiji.fr</p>
    </header>

    <!-- La liste des tests est injectée ici par le script ci-dessous -->
    <main id="contenu"></main>

    <footer>
      <p>Bac à sable de la marque <span class="marque">SV</span> · mirobol.fr · v1.0.0</p>
    </footer>

  </div>

  <script>
    /*
      ============================================================
      LISTE DES TESTS
      ------------------------------------------------------------
      Un objet par test : { nom, desc, url }
        - url = le dossier du test, ex. "essai-jeu/"
      Au départ la liste est VIDE → la page affiche un message.
      Exemple (à décommenter et adapter quand tu ajoutes un test) :

      { nom: "Essai jeu", desc: "Prototype à essayer", url: "essai-jeu/" },
      ============================================================
    */
    const TESTS = [
      // ← ajoute tes tests ici, un par ligne
    ];

    const contenu = document.getElementById("contenu");

    if (TESTS.length === 0) {
      // Aucun test : on affiche un message d'attente
      contenu.innerHTML = `<div class="vide">
        Aucun test en ligne pour l'instant.<br>
        Dépose un dossier (ex. <b>essai-jeu/</b>) puis ajoute-le dans la liste TESTS.
      </div>`;
    } else {
      // Sinon on construit une carte cliquable par test
      const grille = document.createElement("div");
      grille.className = "grille";

      TESTS.forEach(test => {
        const carte = document.createElement("a");
        carte.className = "carte";
        carte.href = test.url;
        const initiale = test.nom.trim().charAt(0).toUpperCase();
        carte.innerHTML = `
          <div class="pastille">${initiale}</div>
          <div class="carte-texte">
            <div class="carte-nom">${test.nom}</div>
            <div class="carte-desc">${test.desc}</div>
          </div>
        `;
        grille.appendChild(carte);
      });

      contenu.appendChild(grille);
    }
  </script>
</body>
</html>
